name: Release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package without publishing
        required: false
        default: HEAD

permissions:
  contents: read

jobs:
  package:
    name: Validate release package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none

      - name: Build package twice
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v10.2.0' }}
        run: |
          ci/build-release.sh "$RELEASE_REF" "$RELEASE_TAG" dist-first
          ci/build-release.sh "$RELEASE_REF" "$RELEASE_TAG" dist-second
          cmp dist-first/mod_subcourse-v10.2.0.zip dist-second/mod_subcourse-v10.2.0.zip
          mkdir dist
          cp dist-first/mod_subcourse-v10.2.0.zip dist/
          cp dist-first/mod_subcourse-v10.2.0.zip.sha256 dist/

      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod_subcourse-v10.2.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod_subcourse-v10.2.0
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/mod_subcourse-v10.2.0.zip
          dist/mod_subcourse-v10.2.0.zip.sha256
          --verify-tag
          --generate-notes
          --title "Subcourse $RELEASE_TAG"
